services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metland-library-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - app_uploads:/app/public/uploads

volumes:
  app_uploads:
    name: metland_library_uploads
